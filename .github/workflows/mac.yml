# Construye Signa para Mac en los Mac de GitHub (Apple Silicon e Intel): Signa.app en un .dmg para instalar y en un
# .zip para las actualizaciones. La FIRMA de las actualizaciones no se hace aquí: tools/release.py, en el PC del
# admin, los descarga del release «v<versión>» de este repo, los firma con su clave y los publica.
# (Al release y no como artefactos: en un repo privado los artefactos tienen una cuota de almacenamiento muy pequeña y
# el 29/10 ya no dejaba subir ninguno; los releases no cuentan para ella.)
name: Build Signa for Mac

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to the release of this version (no = only build and check, e.g. to test the signing)"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write  # crear el release de la versión y subirle los ficheros

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]   # arm64 · x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt pyinstaller==6.16.0

      # firma con el MISMO certificado en cada versión (tools/mac_sign_cert.py): así el llavero de macOS reconoce las
      # versiones nuevas como la misma app y no vuelve a pedir la contraseña tras cada actualización
      - name: Signing certificate (temporary keychain)
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          test -n "$MAC_CERT_P12" || { echo "::error::missing secret MAC_CERT_P12: run tools/mac_sign_cert.py"; exit 1; }
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPASS=$(openssl rand -hex 16)
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/sign.p12"
          HASH=$(security find-certificate -c "Signa Code Signing" -Z "$KC" | awk '/SHA-1/{print $NF; exit}')
          test -n "$HASH" || { echo "::error::signing certificate not found after import"; exit 1; }
          echo "MAC_SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"

      - name: Build Signa.app, .dmg and update .zip
        run: python tools/build.py

      - name: The packaged app has everything inside
        run: |
          APP=dist/Signa.app/Contents/MacOS/Signa
          "$APP" --module signa.selfcheck --net
          # sin cuenta, el supervisor del Gateway explica cómo se usa y sale con 1
          set +e; "$APP" --module signa.gateway; test $? -eq 1

      - name: Upload to the release of this version
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python -c "import signa; print(signa.__version__)")
          # los dos Mac llegan a la vez: el que no lo crea, lo encuentra hecho
          for i in 1 2 3 4 5; do
            gh release view "v$V" >/dev/null 2>&1 && break
            gh release create "v$V" --title "Signa $V" --notes "Mac builds (signed and published by tools/release.py)" \
              && break
            sleep 5
          done
          gh release upload "v$V" dist/*.dmg dist/Signa-mac-*.zip --clobber
